<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Host Dashboard - Quiz Grand Finale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Anek Malayalam', 'Segoe UI', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08080f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            max-width: 1400px;
            width: 100%;
            height: 100%;
            max-height: 950px;
            background: rgba(18, 18, 40, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 28px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.12);
            display: flex;
            flex-direction: column;
            border-color: #ffd700;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.12), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.2);
            animation: cardPulse 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes cardPulse {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.08), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.15);
            }
            50% {
                box-shadow: 0 0 120px rgba(255, 215, 0, 0.18), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.3);
            }
        }

        .main-card::before,
        .main-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .main-card::before {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 70%);
        }
        .main-card::after {
            width: 350px;
            height: 350px;
            bottom: -120px;
            left: -120px;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.15), transparent 70%);
            animation-delay: 4s;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, 20px) scale(1.2);
            }
        }
        .main-card>* {
            position: relative;
            z-index: 1;
        }

        /* ---------- EVENT HEADING ---------- */
        .event-heading {
            text-align: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .event-heading h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 10px rgba(255, 215, 0, 0.2));
            line-height: 1.2;
        }
        .event-heading .sub-line {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: rgba(255, 215, 0, 0.5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 2px;
            -webkit-text-fill-color: rgba(255, 215, 0, 0.5);
        }

        .host-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-shrink: 0;
            padding: 6px 4px 0 4px;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            padding-top: 8px;
        }
        .host-header h2 {
            color: rgba(255, 215, 0, 0.7);
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            -webkit-text-fill-color: rgba(255, 215, 0, 0.7);
        }
        .live-badge {
            background: #ff1a4a;
            color: #fff;
            padding: 4px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            animation: blinkLive 1.4s infinite;
            box-shadow: 0 0 30px rgba(255, 26, 74, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .live-badge::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blinkDot 1.4s infinite;
        }
        @keyframes blinkLive {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 30px rgba(255, 26, 74, 0.4);
            }
            50% {
                opacity: 0.85;
                box-shadow: 0 0 60px rgba(255, 26, 74, 0.7);
            }
        }
        @keyframes blinkDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.7);
            }
        }

        /* ---------- QUESTION NUMBER ---------- */
        #questionHost {
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(4px);
            padding: 8px 28px;
            border-radius: 18px;
            color: #ffd700;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            border-left: 8px solid #ffd700;
            min-height: 56px;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.08);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.3s;
        }
        #questionHost.loading {
            color: rgba(255, 215, 0, 0.4);
            animation: pulseLoading 1.2s ease-in-out infinite;
        }
        @keyframes pulseLoading {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        #questionHost .poll-status {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            display: block;
            margin-top: 4px;
            font-weight: 400;
            letter-spacing: 1px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.3);
        }

        /* ============================================================
           HORIZONTAL BAR CHART — KBC STYLE (INSTANT UPDATE)
           ============================================================ */
        .options-grid-host {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
            margin-bottom: 6px;
            align-content: stretch;
        }

        .option-item {
            background: rgba(20, 20, 48, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            padding: 12px 14px 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .option-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .option-item.highlight {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.08), 0 4px 24px rgba(0, 0, 0, 0.5);
        }

        .option-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            flex-shrink: 0;
        }

        .option-label {
            font-weight: 900;
            color: #fff;
            font-size: 1.4rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .option-label .vote-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
            padding: 0 10px;
            border-radius: 30px;
        }

        .option-percent {
            font-weight: 800;
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.4);
            padding: 0 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-width: 54px;
            text-align: center;
        }

        /* bar track */
        .bar-bg {
            width: 100%;
            height: 100%;
            min-height: 32px;
            max-height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            flex-shrink: 0;
        }

        /* ---------- INDIVIDUAL KBC COLORS (NO ANIMATION) ---------- */
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 14px;
            color: #fff;
            font-weight: 900;
            font-size: 0.9rem;
            transition: none;
            /* INSTANT */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        }

        /* Option A - RED */
        .bar-fill-a {
            background: linear-gradient(90deg, #c0392b, #e74c3c, #ff6b6b);
            background-size: 200% 100%;
            animation: shimmerBar 3s linear infinite;
        }
        /* Option B - BLUE */
        .bar-fill-b {
            background: linear-gradient(90deg, #2471a3, #3498db, #5dade2);
            background-size: 200% 100%;
            animation: shimmerBar 3s linear infinite;
        }
        /* Option C - YELLOW */
        .bar-fill-c {
            background: linear-gradient(90deg, #b7950b, #f1c40f, #f7dc6f);
            background-size: 200% 100%;
            animation: shimmerBar 3s linear infinite;
            color: #1a1a1a;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.4);
        }
        /* Option D - GREEN */
        .bar-fill-d {
            background: linear-gradient(90deg, #1e8449, #2ecc71, #58d68d);
            background-size: 200% 100%;
            animation: shimmerBar 3s linear infinite;
        }

        @keyframes shimmerBar {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        .bar-fill .bar-text {
            position: relative;
            z-index: 2;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        /* empty state */
        .bar-fill.empty {
            background: rgba(255, 255, 255, 0.03) !important;
            animation: none !important;
            box-shadow: none !important;
            justify-content: center;
            padding-right: 0;
            color: rgba(255, 255, 255, 0.1);
            text-shadow: none;
        }
        .bar-fill.empty .bar-text {
            color: rgba(255, 255, 255, 0.08);
            font-size: 0.75rem;
        }

        /* ---------- STATUS ---------- */
        #hostStatus {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.3s;
            padding: 4px 12px;
            border-radius: 60px;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        #hostStatus.flash-green {
            color: #0f0;
            background: rgba(0, 255, 0, 0.06);
            animation: statusFlash 0.5s ease;
        }
        @keyframes statusFlash {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
            }
        }

        /* ---------- STATS ---------- */
        .host-stats {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .host-stats span {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .host-stats .num {
            color: #ffd700;
            font-size: 1.6rem;
            font-weight: 900;
            display: inline-block;
            transition: 0.2s;
            min-width: 30px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .host-stats .num.pop {
            animation: popNum 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popNum {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.8);
                color: #fff;
                text-shadow: 0 0 60px #ffd700;
            }
            100% {
                transform: scale(1);
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (min-width: 1024px) {
            .main-card {
                max-height: 1000px;
                padding: 28px 44px;
                border-radius: 56px;
            }
            .event-heading h1 {
                font-size: 2.8rem;
            }
            .event-heading .sub-line {
                font-size: 1rem;
                letter-spacing: 8px;
            }
            #questionHost {
                font-size: 3.4rem;
                padding: 10px 32px;
                min-height: 64px;
                margin-bottom: 12px;
            }
            .options-grid-host {
                gap: 20px;
            }
            .option-item {
                padding: 16px 20px 14px 20px;
                border-radius: 24px;
            }
            .option-label {
                font-size: 1.8rem;
            }
            .option-label .vote-count {
                font-size: 0.9rem;
            }
            .option-percent {
                font-size: 1.6rem;
                min-width: 64px;
            }
            .bar-bg {
                min-height: 40px;
                max-height: 56px;
                border-radius: 40px;
            }
            .bar-fill {
                font-size: 1.1rem;
                padding-right: 20px;
            }
            .bar-fill .bar-text {
                font-size: 1.0rem;
            }
            .host-stats {
                font-size: 0.9rem;
                padding: 6px 8px;
            }
            .host-stats span {
                padding: 4px 18px;
                gap: 10px;
            }
            .host-stats .num {
                font-size: 1.8rem;
                min-width: 36px;
            }
            #hostStatus {
                font-size: 1.2rem;
                padding: 4px 14px;
            }
        }

        @media (max-width: 600px) {
            .main-card {
                padding: 12px;
                max-height: none;
                border-radius: 28px;
            }
            .event-heading h1 {
                font-size: 1.4rem;
            }
            .event-heading .sub-line {
                font-size: 0.55rem;
                letter-spacing: 3px;
            }
            .host-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                border-top: none;
                padding-top: 0;
                margin-bottom: 4px;
            }
            .host-header h2 {
                font-size: 1rem;
            }
            .live-badge {
                font-size: 0.7rem;
                padding: 2px 14px;
            }
            #questionHost {
                font-size: 1.6rem;
                padding: 6px 14px;
                min-height: 36px;
                border-left-width: 4px;
                margin-bottom: 6px;
            }
            .options-grid-host {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .option-item {
                padding: 8px 10px 6px 10px;
                border-radius: 16px;
            }
            .option-label {
                font-size: 1.1rem;
            }
            .option-label .vote-count {
                font-size: 0.6rem;
                padding: 0 6px;
            }
            .option-percent {
                font-size: 0.85rem;
                min-width: 40px;
                padding: 0 8px;
            }
            .bar-bg {
                min-height: 22px;
                max-height: 32px;
                border-radius: 30px;
            }
            .bar-fill {
                font-size: 0.7rem;
                padding-right: 8px;
            }
            .bar-fill .bar-text {
                font-size: 0.6rem;
            }
            .host-stats {
                flex-direction: column;
                align-items: center;
                gap: 4px;
                font-size: 0.7rem;
                padding: 4px 0;
            }
            .host-stats span {
                width: 100%;
                justify-content: center;
                padding: 3px 10px;
                gap: 4px;
            }
            .host-stats .num {
                font-size: 1.2rem;
                min-width: 24px;
            }
            #hostStatus {
                font-size: 0.75rem;
                padding: 3px 8px;
            }
            body {
                padding: 6px;
            }
            .main-card {
                height: auto;
                max-height: none;
            }
        }

        @media (max-width: 420px) {
            .options-grid-host {
                gap: 6px;
            }
            .option-item {
                padding: 6px 6px 4px 6px;
            }
            .option-label {
                font-size: 0.9rem;
            }
            .option-percent {
                font-size: 0.7rem;
                min-width: 32px;
                padding: 0 4px;
            }
            .bar-bg {
                min-height: 18px;
                max-height: 26px;
            }
            .bar-fill {
                font-size: 0.5rem;
                padding-right: 4px;
            }
            .bar-fill .bar-text {
                font-size: 0.5rem;
            }
            .event-heading h1 {
                font-size: 1.1rem;
            }
            #questionHost {
                font-size: 1.2rem;
                padding: 4px 8px;
                min-height: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="event-heading">
            <h1>NOORUSSALAM MADRASA.<br /><span style="font-size:0.7em;">QUIZ GRAND FINALE</span></h1>
            <span class="sub-line">🏆 The Ultimate Showdown 🏆</span>
        </div>

        <div class="host-header">
            <h2>🎯 Host Dashboard</h2>
            <div class="live-badge"> LIVE </div>
        </div>

        <!-- QUESTION NUMBER -->
        <div id="questionHost">
            <span id="qNumberDisplay">Q1</span>
            <span class="poll-status" id="pollStatus"></span>
        </div>

        <!-- HORIZONTAL BAR GRID (KBC COLORS) -->
        <div class="options-grid-host" id="optionsContainerHost">

                </div>
                <div class="bar-bg">
                    <div class="bar-fill bar-fill-b empty" id="bar1" style="width:0%;">
                        <span class="bar-text" id="barText1">0 votes</span>

                </div>
            </div>
            <!-- C - YELLOW -->
            <div class="option-item" id="optItem2">
                <div class="option-header">

                </div>
                <div class="bar-bg">

            <div class="option-item" id="optItem3">
                <div class="option-header">

                    <span class="option-percent" id="pct3">0%</span>
                </div>
                <div class="bar-bg">

                        <span class="bar-text" id="barText3">0 votes</span>

        <div id="hostStatus">⏳ Waiting for audience votes...</div>

        <div class="host-stats">
            <span>📊 Total Votes: <span class="num" id="totalVotes">0</span></span>
            <span>👥 Voters: <span class="num" id="onlineCount">0</span></span>
        </div>
    </div>

    <script>
        // ---------- FIREBASE CONFIG ----------
        const firebaseConfig = {
            apiKey: "AIzaSyDdsjnW0VzoT3vDM-wEGMuipRZgVNDOsJA",
            authDomain: "responds-97113.firebaseapp.com",
            projectId: "responds-97113",
            storageBucket: "responds-97113.firebasestorage.app",
            messagingSenderId: "917085174768",
            appId: "1:917085174768:web:19a93ba15729e1c3f63b35",
            measurementId: "G-SF8VYBDT4F"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence().catch(err => console.warn("Persistence warning:", err));

        let currentPollId = "poll_1";
        let unsubscribeVotes = null;
        let unsubscribePoll = null;
        let prevTotal = 0;

        // DOM refs
        const qNumberDisplay = document.getElementById('qNumberDisplay');
        const pollStatus = document.getElementById('pollStatus');
        const questionHost = document.getElementById('questionHost');
        const bars = [
            document.getElementById('bar0'),
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3')
        ];
        const barTexts = [
            document.getElementById('barText0'),
            document.getElementById('barText1'),
            document.getElementById('barText2'),
            document.getElementById('barText3')
        ];
        const pctLabels = [
            document.getElementById('pct0'),
            document.getElementById('pct1'),
            document.getElementById('pct2'),
            document.getElementById('pct3')
        ];
        const voteCountLabels = [
            document.getElementById('voteCount0'),
            document.getElementById('voteCount1'),
            document.getElementById('voteCount2'),
            document.getElementById('voteCount3')
        ];
        const optItems = [
            document.getElementById('optItem0'),
            document.getElementById('optItem1'),
            document.getElementById('optItem2'),
            document.getElementById('optItem3')
        ];
        const totalSpan = document.getElementById('totalVotes');
        const onlineSpan = document.getElementById('onlineCount');
        const hostStatus = document.getElementById('hostStatus');

        // ---------- AUTH ----------
        firebase.auth().signInAnonymously()
            .then(() => {
                console.log("✅ Authenticated");
                loadPoll();
            })
            .catch(err => {
                console.error("Auth error:", err);
                hostStatus.innerText = '⚠️ Auth failed! Please refresh.';
            });

        // ---------- HELPERS ----------
        function getQuestionNumber(pollId) {
            const num = pollId.replace('poll_', '');
            return num || '?';
        }

        function updateQuestionDisplay(pollId, isLoading = false, docExists = true) {
            const qNum = getQuestionNumber(pollId);
            qNumberDisplay.innerText = "Q" + qNum;

            if (isLoading) {
                questionHost.classList.add('loading');
                pollStatus.innerText = '⏳ Loading...';
            } else if (!docExists) {
                questionHost.classList.remove('loading');
                pollStatus.innerText = '⚠️ Poll not found. Create via Admin.';
                pollStatus.style.color = 'rgba(255, 100, 100, 0.6)';
            } else {
                questionHost.classList.remove('loading');
                pollStatus.innerText = '✅ Live';
                pollStatus.style.color = 'rgba(0, 255, 0, 0.4)';
            }
        }

        // ---------- LOAD POLL ----------
        function loadPoll() {
            updateQuestionDisplay(currentPollId, true);

            db.collection('config').doc('app').set({
                currentPollId: currentPollId,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => console.error("Error updating global config:", err));

            if (unsubscribeVotes) { unsubscribeVotes();
                unsubscribeVotes = null; }
            if (unsubscribePoll) { unsubscribePoll();
                unsubscribePoll = null; }

            setupHostListener(currentPollId);
        }

        // ---------- HOST LISTENER ----------
        function setupHostListener(pollId) {
            const pollRef = db.collection('polls').doc(pollId);
            unsubscribePoll = pollRef.onSnapshot((doc) => {
                const exists = doc.exists;
                updateQuestionDisplay(pollId, false, exists);
            }, (err) => {
                console.error("Poll listener error:", err);
                updateQuestionDisplay(pollId, false, false);
                pollStatus.innerText = '⚠️ Error loading poll';
                pollStatus.style.color = 'rgba(255, 50, 50, 0.6)';
            });

            const votesRef = db.collection('polls').doc(pollId).collection('votes');
            unsubscribeVotes = votesRef.onSnapshot((snapshot) => {
                const counts = [0, 0, 0, 0];
                let total = 0;
                const users = new Set();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.option !== undefined && data.option >= 0 && data.option <= 3) {
                        counts[data.option] += 1;
                    }
                    total += 1;
                    users.add(doc.id);
                });

                // Update vote count labels
                counts.forEach((c, i) => {
                    voteCountLabels[i].innerText = c;
                });

                const maxVotes = Math.max(...counts, 1);
                const hasVotes = total > 0;

                // Update each bar (INSTANT width change, no transition)
                bars.forEach((bar, idx) => {
                    const count = counts[idx];
                    let percent = hasVotes ? (count / maxVotes) * 100 : 0;
                    if (hasVotes && count === 0) percent = 2;

                    percent = Math.min(100, Math.max(0, percent));

                    // Instant snap
                    bar.style.width = percent + '%';

                    // Percentage label
                    const pctDisplay = hasVotes ? Math.round((count / total) * 100) : 0;
                    pctLabels[idx].innerText = pctDisplay + '%';

                    // Bar text
                    if (hasVotes && count > 0) {
                        barTexts[idx].innerText = count + ' vote' + (count > 1 ? 's' : '');
                    } else if (hasVotes && count === 0) {
                        barTexts[idx].innerText = '0 votes';
                    } else {
                        barTexts[idx].innerText = '0 votes';
                    }

                    // Toggle empty class
                    if (!hasVotes || count === 0) {
                        bar.classList.add('empty');
                    } else {
                        bar.classList.remove('empty');
                    }

                    // Highlight leader
                    optItems.forEach(item => item.classList.remove('highlight'));
                    if (hasVotes) {
                        const maxIdx = counts.indexOf(Math.max(...counts));
                        if (maxIdx >= 0 && counts[maxIdx] > 0) {
                            optItems[maxIdx].classList.add('highlight');
                        }
                    }
                });

                // Total votes
                if (total !== prevTotal) {
                    totalSpan.innerText = total;
                    totalSpan.classList.remove('pop');
                    void totalSpan.offsetWidth;
                    totalSpan.classList.add('pop');

                    hostStatus.classList.remove('flash-green');
                    void hostStatus.offsetWidth;
                    hostStatus.classList.add('flash-green');
                    setTimeout(() => hostStatus.classList.remove('flash-green'), 600);
                    prevTotal = total;
                }

                onlineSpan.innerText = users.size;
                hostStatus.innerText = total > 0 ? `✅ ${total} people voted! (Live)` : '⏳ Waiting for audience votes...';
                hostStatus.style.color = total > 0 ? '#0f0' : '#ffd700';

            }, (error) => {
                console.error("Votes snapshot error:", error);
                hostStatus.innerText = '⚠️ Real-time error!';
                hostStatus.style.color = 'red';
            });
        }

        // ---------- CONFIG LISTENER (Auto-sync) ----------
        db.collection('config').doc('app').onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const globalPollId = data.currentPollId;
                if (globalPollId && globalPollId !== currentPollId) {
                    console.log("🔄 Host syncing to:", globalPollId);
                    currentPollId = globalPollId;
                    loadPoll();
                }
            }
        }, (err) => {
            console.warn("Config listener error:", err);
        });

        console.log("✅ Host Dashboard Ready! (KBC Style - Horizontal Bars with Colors)");
    </script>
</body>
</html>
