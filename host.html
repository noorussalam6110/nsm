<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Host Dashboard - Quiz Grand Finale</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Anek Malayalam', 'Segoe UI', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08080f;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ---------- MAIN CARD ---------- */
        .main-card {
            max-width: 1400px;
            width: 100%;
            height: 100%;
            max-height: 950px;
            background: rgba(18, 18, 40, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 28px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.12);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-color: #ffd700;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.12), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.2);
            animation: cardPulse 4s ease-in-out infinite;
        }

        @keyframes cardPulse {
            0%,
            100% {
                box-shadow: 0 0 60px rgba(255, 215, 0, 0.08), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.15);
            }
            50% {
                box-shadow: 0 0 120px rgba(255, 215, 0, 0.18), 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 215, 0, 0.3);
            }
        }

        /* Animated orbs */
        .main-card::before,
        .main-card::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            z-index: 0;
            animation: orbFloat 12s ease-in-out infinite alternate;
        }
        .main-card::before {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -150px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2), transparent 70%);
        }
        .main-card::after {
            width: 350px;
            height: 350px;
            bottom: -120px;
            left: -120px;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.15), transparent 70%);
            animation-delay: 4s;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, 20px) scale(1.2);
            }
        }
        .main-card>* {
            position: relative;
            z-index: 1;
        }

        /* ---------- EVENT HEADING ---------- */
        .event-heading {
            text-align: center;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .event-heading h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3), 0 4px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 10px rgba(255, 215, 0, 0.2));
            line-height: 1.2;
        }
        .event-heading .sub-line {
            display: block;
            font-size: 0.9rem;
            font-weight: 400;
            color: rgba(255, 215, 0, 0.5);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 2px;
            -webkit-text-fill-color: rgba(255, 215, 0, 0.5);
        }

        /* ---------- HEADER ---------- */
        .host-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
            padding: 6px 4px 0 4px;
            border-top: 1px solid rgba(255, 215, 0, 0.08);
            padding-top: 8px;
        }
        .host-header h2 {
            color: rgba(255, 215, 0, 0.7);
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            letter-spacing: 2px;
            -webkit-text-fill-color: rgba(255, 215, 0, 0.7);
        }
        .live-badge {
            background: #ff1a4a;
            color: #fff;
            padding: 4px 20px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            animation: blinkLive 1.4s infinite;
            box-shadow: 0 0 30px rgba(255, 26, 74, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .live-badge::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blinkDot 1.4s infinite;
        }
        @keyframes blinkLive {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 30px rgba(255, 26, 74, 0.4);
            }
            50% {
                opacity: 0.85;
                box-shadow: 0 0 60px rgba(255, 26, 74, 0.7);
            }
        }
        @keyframes blinkDot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.7);
            }
        }

        /* ---------- QUESTION (Q1, Q2...) ---------- */
        #questionHost {
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(4px);
            padding: 8px 28px;
            border-radius: 18px;
            color: #ffd700;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 12px;
            border-left: 8px solid #ffd700;
            min-height: 56px;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.08);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ---------- GRID - GIANT BARS WITH A/B/C/D LABELS ---------- */
        .options-grid-host {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            flex: 1;
            min-height: 0;
            margin-bottom: 8px;
        }
        .option-item {
            background: rgba(20, 20, 48, 0.5);
            backdrop-filter: blur(4px);
            padding: 12px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* A/B/C/D Labels - Clearly visible above bars */
        .option-label {
            font-weight: 800;
            color: #ffd700;
            font-size: 1.4rem;
            display: block;
            margin-bottom: 4px;
            flex-shrink: 0;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .bar-bg {
            width: 100%;
            height: 100%;
            min-height: 36px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.8);
            position: relative;
            border: 1px solid rgba(255, 215, 0, 0.06);
            flex: 1;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 100%;
            animation: shimmerBar 2.8s linear infinite;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
            color: #0a0a12;
            font-weight: 900;
            font-size: 1.4rem;
            transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
            position: relative;
            overflow: hidden;
        }
        @keyframes shimmerBar {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ---------- STATUS ---------- */
        #hostStatus {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.3s;
            padding: 4px 12px;
            border-radius: 60px;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        #hostStatus.flash-green {
            color: #0f0;
            background: rgba(0, 255, 0, 0.06);
            animation: statusFlash 0.5s ease;
        }
        @keyframes statusFlash {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
            }
        }

        /* ---------- STATS (SMALLER BOXES) ---------- */
        .host-stats {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-weight: 600;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        .host-stats span {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }
        .host-stats .num {
            color: #ffd700;
            font-size: 1.6rem;
            font-weight: 900;
            display: inline-block;
            transition: 0.2s;
            min-width: 30px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .host-stats .num.pop {
            animation: popNum 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popNum {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.8);
                color: #fff;
                text-shadow: 0 0 60px #ffd700;
            }
            100% {
                transform: scale(1);
            }
        }

        /* ================================================================
           LAPTOP / PROJECTOR OPTIMIZATION (1024px+)
           ================================================================ */
        @media (min-width: 1024px) {
            .main-card {
                max-height: 1000px;
                padding: 28px 44px;
                border-radius: 56px;
            }
            .event-heading h1 {
                font-size: 2.8rem;
            }
            .event-heading .sub-line {
                font-size: 1rem;
                letter-spacing: 8px;
            }
            .host-header h2 {
                font-size: 1.3rem;
            }
            .live-badge {
                font-size: 1rem;
                padding: 6px 28px;
            }
            #questionHost {
                font-size: 3.4rem;
                padding: 10px 32px;
                min-height: 64px;
                margin-bottom: 14px;
            }
            .options-grid-host {
                gap: 22px;
            }
            .option-item {
                padding: 16px 24px;
                border-radius: 28px;
            }
            .option-label {
                font-size: 1.8rem;
                margin-bottom: 6px;
            }
            .bar-bg {
                min-height: 44px;
            }
            .bar-fill {
                font-size: 1.6rem;
                padding-right: 26px;
            }
            /* Smaller Stats on Laptop */
            .host-stats {
                font-size: 0.9rem;
                padding: 6px 8px;
            }
            .host-stats span {
                padding: 4px 18px;
                gap: 10px;
            }
            .host-stats .num {
                font-size: 1.8rem;
                min-width: 36px;
            }
            #hostStatus {
                font-size: 1.2rem;
                padding: 4px 14px;
            }
        }

        /* ================================================================
           MOBILE ADJUSTMENTS
           ================================================================ */
        @media (max-width: 600px) {
            .main-card {
                padding: 12px;
                max-height: none;
                border-radius: 28px;
            }
            .event-heading h1 {
                font-size: 1.5rem;
            }
            .event-heading .sub-line {
                font-size: 0.6rem;
                letter-spacing: 4px;
            }
            .host-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                border-top: none;
                padding-top: 0;
            }
            .host-header h2 {
                font-size: 1rem;
            }
            .live-badge {
                font-size: 0.7rem;
                padding: 3px 12px;
            }
            .live-badge::before {
                width: 8px;
                height: 8px;
            }
            #questionHost {
                font-size: 1.8rem;
                padding: 6px 14px;
                min-height: 40px;
                border-left-width: 4px;
                margin-bottom: 8px;
            }
            .options-grid-host {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .option-item {
                padding: 10px 14px;
            }
            .option-label {
                font-size: 1.2rem;
                margin-bottom: 2px;
            }
            .bar-bg {
                min-height: 24px;
            }
            .bar-fill {
                font-size: 0.9rem;
                padding-right: 12px;
            }
            .host-stats {
                flex-direction: column;
                align-items: center;
                gap: 6px;
                font-size: 0.75rem;
                padding: 4px 0;
            }
            .host-stats span {
                width: 100%;
                justify-content: center;
                padding: 4px 12px;
                gap: 6px;
            }
            .host-stats .num {
                font-size: 1.4rem;
                min-width: 28px;
            }
            #hostStatus {
                font-size: 0.85rem;
                padding: 4px 8px;
            }
            body {
                padding: 8px;
            }
            .main-card {
                height: auto;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- ============================================================
        EVENT HEADING
        ============================================================ -->
        <div class="event-heading">
            <h1>NOORUSSALAM MADRASA.<br /><span style="font-size:0.7em;">QUIZ GRAND FINALE</span></h1>
            <span class="sub-line">🏆 The Ultimate Showdown 🏆</span>
        </div>

        <!-- HEADER -->
        <div class="host-header">
            <h2>🎯 Host Dashboard</h2>
            <div class="live-badge"> LIVE </div>
        </div>

        <!-- QUESTION -->
        <div id="questionHost">Q1</div>

        <!-- ============================================================
        GRID WITH A/B/C/D LABELS + BARS
        ============================================================ -->
        <div class="options-grid-host" id="optionsContainerHost">
            <div class="option-item">
                <span class="option-label">A.</span>
                <div class="bar-bg"><div class="bar-fill" id="bar0">0%</div></div>
            </div>
            <div class="option-item">
                <span class="option-label">B.</span>
                <div class="bar-bg"><div class="bar-fill" id="bar1">0%</div></div>
            </div>
            <div class="option-item">
                <span class="option-label">C.</span>
                <div class="bar-bg"><div class="bar-fill" id="bar2">0%</div></div>
            </div>
            <div class="option-item">
                <span class="option-label">D.</span>
                <div class="bar-bg"><div class="bar-fill" id="bar3">0%</div></div>
            </div>
        </div>

        <!-- STATUS -->
        <div id="hostStatus">⏳ Waiting for audience votes...</div>

        <!-- ============================================================
        STATS (SMALLER BOXES)
        ============================================================ -->
        <div class="host-stats">
            <span>📊 Total Votes: <span class="num" id="totalVotes">0</span></span>
            <span>👥 Voters: <span class="num" id="onlineCount">0</span></span>
        </div>
    </div>

    <script>
        // ---------- FIREBASE CONFIG ----------
        const firebaseConfig = {
            apiKey: "AIzaSyDdsjnW0VzoT3vDM-wEGMuipRZgVNDOsJA",
            authDomain: "responds-97113.firebaseapp.com",
            projectId: "responds-97113",
            storageBucket: "responds-97113.firebasestorage.app",
            messagingSenderId: "917085174768",
            appId: "1:917085174768:web:19a93ba15729e1c3f63b35",
            measurementId: "G-SF8VYBDT4F"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence().catch(err => console.warn("Persistence warning:", err));

        let currentPollId = "poll_1";
        let unsubscribeVotes = null;
        let prevTotal = 0;

        // DOM refs
        const questionHost = document.getElementById('questionHost');
        const bars = [
            document.getElementById('bar0'),
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3')
        ];
        const totalSpan = document.getElementById('totalVotes');
        const onlineSpan = document.getElementById('onlineCount');
        const hostStatus = document.getElementById('hostStatus');

        // ---------- AUTH ----------
        firebase.auth().signInAnonymously()
            .then(() => {
                console.log("Authenticated");
                loadPoll();
            })
            .catch(err => console.error("Auth error:", err));

        // ---------- HELPERS ----------
        function getQuestionNumber(pollId) {
            const num = pollId.replace('poll_', '');
            return num || '?';
        }

        function updateQuestionUI(pollId) {
            questionHost.innerText = "Q" + getQuestionNumber(pollId);
        }

        // ---------- LOAD POLL ----------
        function loadPoll() {
            updateQuestionUI(currentPollId);

            db.collection('config').doc('app').set({
                currentPollId: currentPollId,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(err => console.error("Error updating global config:", err));

            if (unsubscribeVotes) { unsubscribeVotes();
                unsubscribeVotes = null; }
            setupHostListener(currentPollId);
        }

        // ---------- HOST LISTENER ----------
        function setupHostListener(pollId) {
            db.collection('polls').doc(pollId).onSnapshot((doc) => {
                const qNum = getQuestionNumber(pollId);
                questionHost.innerText = "Q" + qNum;
            }, (err) => console.error("Host question error:", err));

            const votesRef = db.collection('polls').doc(pollId).collection('votes');
            unsubscribeVotes = votesRef.onSnapshot((snapshot) => {
                const counts = [0, 0, 0, 0];
                let total = 0;
                const users = new Set();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.option !== undefined && data.option >= 0 && data.option <= 3) {
                        counts[data.option] += 1;
                    }
                    total += 1;
                    users.add(doc.id);
                });

                let maxVotes = Math.max(...counts, 1);
                bars.forEach((bar, idx) => {
                    let percentage = (counts[idx] / maxVotes) * 100;
                    if (total === 0) percentage = 0;
                    bar.style.width = percentage + '%';
                    bar.innerText = counts[idx] > 0 ? counts[idx] + ' (' + Math.round((counts[idx] / total) *
                        100) + '%)' : '0%';
                });

                if (total !== prevTotal) {
                    totalSpan.innerText = total;
                    totalSpan.classList.remove('pop');
                    void totalSpan.offsetWidth;
                    totalSpan.classList.add('pop');

                    hostStatus.classList.remove('flash-green');
                    void hostStatus.offsetWidth;
                    hostStatus.classList.add('flash-green');
                    setTimeout(() => hostStatus.classList.remove('flash-green'), 600);
                    prevTotal = total;
                }

                onlineSpan.innerText = users.size;
                hostStatus.innerText = total > 0 ? `✅ ${total} people voted! (Live)` : '⏳ Waiting for audience votes...';
                hostStatus.style.color = total > 0 ? '#0f0' : '#ffd700';

            }, (error) => {
                console.error("Votes snapshot error:", error);
                hostStatus.innerText = '⚠️ Real-time error!';
                hostStatus.style.color = 'red';
            });
        }

        // Listen to config changes (auto-sync)
        db.collection('config').doc('app').onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const globalPollId = data.currentPollId;
                if (globalPollId && globalPollId !== currentPollId) {
                    console.log("🔄 Host syncing to:", globalPollId);
                    currentPollId = globalPollId;
                    loadPoll();
                }
            }
        });

        console.log("✅ Host Dashboard Ready! (With A/B/C/D Labels & Smaller Stats)");
    </script>
</body>
</html>
