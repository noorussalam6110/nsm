<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KBC - Audience Poll</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Anek Malayalam', 'Segoe UI', sans-serif;
        }

        body {
            background: #08080f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .main-card {
            max-width: 500px;
            width: 100%;
            background: rgba(18, 18, 40, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.12);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.03), transparent, rgba(255, 215, 0, 0.05), transparent);
            animation: shimmerRotate 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes shimmerRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .main-card>* {
            position: relative;
            z-index: 1;
        }

        /* Sync hint */
        .sync-hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            margin-bottom: 12px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
        }
        .sync-hint .highlight {
            color: #ffd700;
        }

        /* Question */
        #questionAud {
            background: rgba(10, 10, 30, 0.5);
            backdrop-filter: blur(4px);
            padding: 14px;
            border-radius: 18px;
            color: #ffd700;
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 18px;
            border-left: 4px solid #ffd700;
            min-height: 50px;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Voting Buttons */
        .options-grid-aud {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .opt-btn {
            background: rgba(20, 20, 48, 0.6);
            backdrop-filter: blur(4px);
            padding: 24px 10px;
            border-radius: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
        }
        .opt-btn:active {
            transform: scale(0.95);
        }
        .opt-btn.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.08);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.08), 0 6px 0 rgba(0, 0, 0, 0.3);
        }
        .opt-btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .opt-btn .label {
            color: #ffd700;
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        /* Status */
        #audStatus {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            margin-top: 18px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .aud-footer {
            text-align: center;
            margin-top: 12px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.65rem;
        }

        /* ================================================================
           ADMIN TOGGLE (Password Protected, Computer Only)
           ================================================================ */
        .admin-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(255, 215, 0, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            color: #ffd700;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .admin-toggle:hover {
            background: rgba(255, 215, 0, 0.15);
            transform: scale(1.1) rotate(90deg);
            border-color: rgba(255, 215, 0, 0.4);
        }

        /* ---------- ADMIN PANEL ---------- */
        .admin-panel {
            position: fixed;
            top: 72px;
            right: 20px;
            z-index: 9998;
            background: rgba(12, 12, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 20px;
            padding: 18px 22px;
            min-width: 260px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .admin-panel.open {
            display: flex;
        }
        .admin-panel label {
            color: #ffd700;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        .admin-panel input {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            transition: 0.3s;
        }
        .admin-panel input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .admin-panel .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .admin-panel .btn-group button {
            flex: 1;
            padding: 6px 12px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            font-size: 0.75rem;
            min-width: 56px;
            letter-spacing: 0.5px;
        }
        .admin-panel .btn-load {
            background: #ffd700;
            color: #0a0a12;
        }
        .admin-panel .btn-load:hover {
            background: #ffe44d;
            transform: scale(1.02);
        }
        .admin-panel .btn-next {
            background: #ffd700;
            color: #0a0a12;
        }
        .admin-panel .btn-next:hover {
            background: #ffe44d;
            transform: scale(1.02);
        }
        .admin-panel .btn-reset {
            background: #cc0033;
            color: #fff;
        }
        .admin-panel .btn-reset:hover {
            background: #ff1a4a;
            transform: scale(1.02);
        }
        .admin-panel .close-panel {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-panel .close-panel:hover {
            color: #fff;
        }

        /* ================================================================
           🔥 HIDE ADMIN BUTTON & PANEL ON MOBILE (Computer Only)
           ================================================================ */
        @media (max-width: 768px) {
            .admin-toggle {
                display: none !important;
            }
            .admin-panel {
                display: none !important;
            }
        }

        @media (max-width: 400px) {
            .main-card {
                padding: 16px;
                border-radius: 24px;
            }
            .opt-btn {
                padding: 20px 8px;
                font-size: 1.2rem;
            }
            #questionAud {
                font-size: 1.6rem;
                padding: 12px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="sync-hint">
            📡 <span class="highlight">Auto-syncing with Host...</span>
        </div>
        <div id="questionAud">Question 1</div>
        <div class="options-grid-aud" id="optionsGridAud">
            <div class="opt-btn" data-opt="0"><span class="label">A</span> <span id="optText0">...</span></div>
            <div class="opt-btn" data-opt="1"><span class="label">B</span> <span id="optText1">...</span></div>
            <div class="opt-btn" data-opt="2"><span class="label">C</span> <span id="optText2">...</span></div>
            <div class="opt-btn" data-opt="3"><span class="label">D</span> <span id="optText3">...</span></div>
        </div>
        <div id="audStatus">✅ Connected. Select an option!</div>
        <div class="aud-footer">⚠️ Once voted, you cannot change your response</div>
    </div>

    <!-- ============================================================
    ADMIN BUTTON & PANEL (Password Protected, Computer Only)
    ============================================================ -->
    <button class="admin-toggle" id="adminToggle" title="Admin Controls">⚙️</button>
    <div class="admin-panel" id="adminPanel">
        <button class="close-panel" id="closeAdminPanel">✕</button>
        <label for="pollIdInputAdmin">📌 Poll ID</label>
        <input type="text" id="pollIdInputAdmin" value="poll_1" placeholder="e.g. poll_2">
        <div class="btn-group">
            <button class="btn-load" onclick="loadPollAdmin()">Load</button>
            <button class="btn-next" onclick="createNextPollAdmin()">Next</button>
            <button class="btn-reset" onclick="clearAllVotesAdmin()">Reset</button>
        </div>
    </div>

    <script>
        // ---------- FIREBASE CONFIG ----------
        const firebaseConfig = {
            apiKey: "AIzaSyDdsjnW0VzoT3vDM-wEGMuipRZgVNDOsJA",
            authDomain: "responds-97113.firebaseapp.com",
            projectId: "responds-97113",
            storageBucket: "responds-97113.firebasestorage.app",
            messagingSenderId: "917085174768",
            appId: "1:917085174768:web:19a93ba15729e1c3f63b35",
            measurementId: "G-SF8VYBDT4F"
        };

        // 🔑 PASSWORD FOR ADMIN ACCESS
        const ADMIN_PASSWORD = "admin123";

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.enablePersistence().catch(err => console.warn("Persistence warning:", err));

        let currentPollId = "poll_1";
        let userId = null;
        let hasVoted = false;
        let unsubscribeQuestion = null;
        let unsubscribeMyVote = null;
        let unsubscribeConfig = null;

        // DOM refs
        const questionAud = document.getElementById('questionAud');
        const optTextsA = [
            document.getElementById('optText0'),
            document.getElementById('optText1'),
            document.getElementById('optText2'),
            document.getElementById('optText3')
        ];
        const audBtns = document.querySelectorAll('.opt-btn');
        const audStatus = document.getElementById('audStatus');

        // Admin panel refs
        const adminToggle = document.getElementById('adminToggle');
        const adminPanel = document.getElementById('adminPanel');
        const closeAdmin = document.getElementById('closeAdminPanel');
        const pollInput = document.getElementById('pollIdInputAdmin');

        // ---------- ADMIN PANEL TOGGLE (PASSWORD PROTECTED) ----------
        adminToggle.addEventListener('click', () => {
            // If panel is already open, just close it
            if (adminPanel.classList.contains('open')) {
                adminPanel.classList.remove('open');
                return;
            }

            // Ask for password
            const enteredPassword = prompt("🔒 Enter admin password to access controls:");
            if (enteredPassword === null) {
                // User cancelled
                return;
            }

            if (enteredPassword === ADMIN_PASSWORD) {
                adminPanel.classList.add('open');
            } else {
                alert("❌ Incorrect password!");
            }
        });

        closeAdmin.addEventListener('click', () => adminPanel.classList.remove('open'));
        document.addEventListener('click', (e) => {
            if (adminPanel.classList.contains('open') &&
                !adminPanel.contains(e.target) &&
                e.target !== adminToggle) {
                adminPanel.classList.remove('open');
            }
        });

        // ---------- AUTH ----------
        firebase.auth().signInAnonymously()
            .then((cred) => {
                userId = cred.user.uid;
                console.log("Authenticated:", userId);
                listenToConfig();
                loadPoll();
            })
            .catch((err) => {
                console.error("Auth Error:", err);
                audStatus.innerText = '⚠️ Network error! Please refresh.';
            });

        // ---------- CONFIG LISTENER (Auto-sync with Host) ----------
        function listenToConfig() {
            const configRef = db.collection('config').doc('app');
            unsubscribeConfig = configRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    const globalPollId = data.currentPollId;
                    if (globalPollId && globalPollId !== currentPollId) {
                        console.log("🔄 Auto-sync triggered by Host:", globalPollId);
                        currentPollId = globalPollId;
                        pollInput.value = currentPollId;
                        detachListeners();
                        setupAudienceListener(currentPollId);
                        updateQuestionUI(currentPollId);
                    }
                }
            }, (err) => console.warn("Config listener error:", err));
        }

        // ---------- DETACH LISTENERS ----------
        function detachListeners() {
            if (unsubscribeQuestion) { unsubscribeQuestion();
                unsubscribeQuestion = null; }
            if (unsubscribeMyVote) { unsubscribeMyVote();
                unsubscribeMyVote = null; }
        }

        // ---------- HELPERS ----------
        function getQuestionNumber(pollId) {
            const num = pollId.replace('poll_', '');
            return num || '?';
        }

        function updateQuestionUI(pollId) {
            questionAud.innerText = "Question " + getQuestionNumber(pollId);
        }

        // ---------- LOAD POLL ----------
        function loadPoll() {
            updateQuestionUI(currentPollId);
            detachListeners();
            setupAudienceListener(currentPollId);
        }

        // ---------- ADMIN WRAPPERS ----------
        window.loadPollAdmin = function() {
            let newId = pollInput.value.trim();
            if (!newId) newId = 'poll_1';
            currentPollId = newId;
            pollInput.value = currentPollId;
            loadPoll();
            adminPanel.classList.remove('open');
        };

        window.createNextPollAdmin = function() {
            const newId = prompt("Enter Poll ID for the next question (e.g., poll_2):", "poll_2");
            if (!newId) return;
            const trimmedId = newId.trim();
            db.collection('polls').doc(trimmedId).get().then(doc => {
                if (doc.exists) {
                    pollInput.value = trimmedId;
                    currentPollId = trimmedId;
                    loadPoll();
                } else {
                    if (confirm(`'${trimmedId}' not found. Create a sample question?`)) {
                        const sampleData = {
                            question: "Sample Question",
                            options: ["Option A", "Option B", "Option C", "Option D"],
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        };
                        db.collection('polls').doc(trimmedId).set(sampleData).then(() => {
                            alert("Sample question created! 🎉");
                            pollInput.value = trimmedId;
                            currentPollId = trimmedId;
                            loadPoll();
                        }).catch(err => alert("Error creating: " + err.message));
                    }
                }
            });
            adminPanel.classList.remove('open');
        };

        window.clearAllVotesAdmin = function() {
            if (!confirm("⚠️ Are you sure you want to DELETE ALL VOTES for this question?")) return;
            const votesRef = db.collection('polls').doc(currentPollId).collection('votes');
            votesRef.get().then((snapshot) => {
                if (snapshot.empty) {
                    alert("ℹ️ No votes to clear.");
                    return;
                }
                const batch = db.batch();
                snapshot.forEach((doc) => batch.delete(doc.ref));
                return batch.commit();
            }).then(() => {
                alert("✅ All votes cleared! Audience can vote again.");
                // Reset UI
                audBtns.forEach(btn => btn.classList.remove('selected', 'disabled'));
                audStatus.innerText = '📢 Votes cleared! Select your opinion!';
                audStatus.style.color = '#ffd700';
                hasVoted = false;
            }).catch((err) => {
                alert("❌ Error clearing votes: " + err.message);
                console.error(err);
            });
            adminPanel.classList.remove('open');
        };

        // ---------- AUDIENCE LISTENER ----------
        function setupAudienceListener(pollId) {
            unsubscribeQuestion = db.collection('polls').doc(pollId).onSnapshot((doc) => {
                const qNum = getQuestionNumber(pollId);
                questionAud.innerText = "Question " + qNum;
                if (doc.exists) {
                    const data = doc.data();
                    optTextsA.forEach((el, idx) => {
                        el.innerText = data.options[idx] || "---";
                    });
                    resetAudienceUI();
                } else {
                    optTextsA.forEach(el => el.innerText = "---");
                }
            }, (err) => console.error("Aud question error:", err));

            if (!userId) return;
            unsubscribeMyVote = db.collection('polls').doc(pollId).collection('votes').doc(userId).onSnapshot((doc) => {
                if (doc.exists) {
                    hasVoted = true;
                    const selectedOpt = doc.data().option;
                    audBtns.forEach((btn, idx) => {
                        btn.classList.add('disabled');
                        if (idx === selectedOpt) btn.classList.add('selected');
                        else btn.classList.remove('selected');
                    });
                    audStatus.innerText = '✅ You have already voted!';
                    audStatus.style.color = '#0f0';
                } else {
                    hasVoted = false;
                    audBtns.forEach(btn => btn.classList.remove('disabled', 'selected'));
                    audStatus.innerText = '📢 Select your opinion!';
                    audStatus.style.color = '#ffd700';
                }
            }, (err) => console.error("My vote error:", err));
        }

        function resetAudienceUI() {
            if (!hasVoted) audBtns.forEach(btn => btn.classList.remove('selected', 'disabled'));
        }

        // ---------- VOTE CLICK ----------
        audBtns.forEach((btn) => {
            btn.addEventListener('click', function() {
                if (hasVoted) { alert("⚠️ You have already voted!"); return; }
                if (!userId) { alert("⚠️ Login issue! Please refresh."); return; }
                const optionIndex = parseInt(this.dataset.opt);
                const voteRef = db.collection('polls').doc(currentPollId).collection('votes').doc(userId);
                voteRef.set({
                    option: optionIndex,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => {
                    hasVoted = true;
                    audBtns.forEach(b => b.classList.add('disabled'));
                    this.classList.add('selected');
                    audStatus.innerText = '🎉 Vote recorded! Thank you.';
                    audStatus.style.color = '#0f0';
                }).catch((err) => {
                    console.error("Vote error:", err);
                    alert("⚠️ Error saving vote! Check internet.");
                });
            });
        });

        // ---------- AUTH STATE CHANGE ----------
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                userId = user.uid;
            }
        });

        console.log("✅ Audience View Ready! (Password Protected Admin on Computer)");
    </script>
</body>
</html>
