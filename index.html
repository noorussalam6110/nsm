<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>സ്കൂൾ അഡ്മിഷൻ ടോക്കൺ സിസ്റ്റം | 14 കൗണ്ടറുകൾ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malayalam', 'Noto Sans Malayalam', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        /* Main Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        /* Token Issuing Panel (Left) */
        .issue-panel {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .issue-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .counter-select {
            margin-bottom: 20px;
        }

        .counter-select label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .counter-select select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .counter-select select:focus {
            outline: none;
            border-color: #667eea;
        }

        .issue-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .issue-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.3);
        }

        .issue-btn:active {
            transform: translateY(0);
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 1.1em;
        }

        .stat-label {
            font-weight: bold;
            color: #555;
        }

        .stat-value {
            color: #667eea;
            font-weight: bold;
            font-size: 1.3em;
        }

        /* Counters Grid (Right) */
        .counters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .counter-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            animation: fadeIn 0.5s ease;
        }

        .counter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .counter-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .counter-header h3 {
            font-size: 1.3em;
        }

        .current-token {
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .current-token .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .current-token .token-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            font-family: monospace;
            letter-spacing: 2px;
        }

        .queue-info {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f4f8;
            border-radius: 10px;
        }

        .queue-info span {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .next-btn, .reset-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .next-btn {
            background: #28a745;
            color: white;
        }

        .next-btn:hover {
            background: #218838;
        }

        .reset-btn {
            background: #ffc107;
            color: #333;
        }

        .reset-btn:hover {
            background: #e0a800;
        }

        .queue-list {
            margin-top: 15px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85em;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .queue-list h4 {
            color: #666;
            margin-bottom: 5px;
        }

        .queue-item {
            padding: 3px 5px;
            background: #f9f9f9;
            margin: 2px 0;
            border-radius: 5px;
            font-family: monospace;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .counters-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 1.5em;
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏫 സ്കൂൾ അഡ്മിഷൻ ടോക്കൺ സിസ്റ്റം</h1>
        <p>14 കൗണ്ടറുകൾ | റിയൽ-ടൈം ക്യൂ മാനേജ്മെന്റ്</p>
    </div>

    <div class="dashboard">
        <!-- Left Panel: Token Issuing -->
        <div class="issue-panel">
            <h2>🎫 പുതിയ ടോക്കൺ എടുക്കുക</h2>
            <div class="counter-select">
                <label>📌 കൗണ്ടർ തിരഞ്ഞെടുക്കുക:</label>
                <select id="counterSelect">
                    <option value="auto">🤖 ഓട്ടോമാറ്റിക് (കുറഞ്ഞ ക്യൂ)</option>
                    <option value="1">കൗണ്ടർ 1 - രജിസ്ട്രേഷൻ</option>
                    <option value="2">കൗണ്ടർ 2 - രജിസ്ട്രേഷൻ</option>
                    <option value="3">കൗണ്ടർ 3 - രജിസ്ട്രേഷൻ</option>
                    <option value="4">കൗണ്ടർ 4 - രേഖാ പരിശോധന</option>
                    <option value="5">കൗണ്ടർ 5 - രേഖാ പരിശോധന</option>
                    <option value="6">കൗണ്ടർ 6 - ഫീസ് അടക്കൽ</option>
                    <option value="7">കൗണ്ടർ 7 - ഫീസ് അടക്കൽ</option>
                    <option value="8">കൗണ്ടർ 8 - ക്ലാസ് അലോട്ട്മെന്റ്</option>
                    <option value="9">കൗണ്ടർ 9 - ക്ലാസ് അലോട്ട്മെന്റ്</option>
                    <option value="10">കൗണ്ടർ 10 - ഫോട്ടോ & ബയോമെട്രിക്</option>
                    <option value="11">കൗണ്ടർ 11 - ഫോട്ടോ & ബയോമെട്രിക്</option>
                    <option value="12">കൗണ്ടർ 12 - യൂണിഫോം & ബുക്ക്</option>
                    <option value="13">കൗണ്ടർ 13 - യൂണിഫോം & ബുക്ക്</option>
                    <option value="14">കൗണ്ടർ 14 - ജനറൽ ഹെൽപ്</option>
                </select>
            </div>
            <button class="issue-btn" onclick="issueToken()">🎟️ ടോക്കൺ എടുക്കുക</button>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">📊 ആകെ ടോക്കണുകൾ:</span>
                    <span class="stat-value" id="totalTokens">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">⏳ കാത്തിരിക്കുന്നവർ:</span>
                    <span class="stat-value" id="waitingCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">✅ സേവനം പൂർത്തിയായവർ:</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
            </div>
        </div>

        <!-- Right Panel: Counters Grid -->
        <div class="counters-grid" id="countersGrid"></div>
    </div>

    <script>
        // Data Structure for 14 Counters
        let counters = [];
        let allTokens = [];
        let nextTokenIds = {};

        // Initialize 14 counters
        for(let i = 1; i <= 14; i++) {
            counters.push({
                id: i,
                name: getCounterName(i),
                currentToken: null,
                queue: [],
                servedCount: 0,
                lastTokenId: 0
            });
            nextTokenIds[i] = 1;
        }

        function getCounterName(counterId) {
            const names = {
                1: "രജിസ്ട്രേഷൻ",
                2: "രജിസ്ട്രേഷൻ",
                3: "രജിസ്ട്രേഷൻ",
                4: "രേഖാ പരിശോധന",
                5: "രേഖാ പരിശോധന",
                6: "ഫീസ് അടക്കൽ",
                7: "ഫീസ് അടക്കൽ",
                8: "ക്ലാസ് അലോട്ട്മെന്റ്",
                9: "ക്ലാസ് അലോട്ട്മെന്റ്",
                10: "ഫോട്ടോ & ബയോമെട്രിക്",
                11: "ഫോട്ടോ & ബയോമെട്രിക്",
                12: "യൂണിഫോം & ബുക്ക്",
                13: "യൂണിഫോം & ബുക്ക്",
                14: "ജനറൽ ഹെൽപ്"
            };
            return names[counterId] || "സേവനം";
        }

        function getCounterWithShortestQueue() {
            let shortest = counters[0];
            for(let i = 1; i < counters.length; i++) {
                if(counters[i].queue.length < shortest.queue.length) {
                    shortest = counters[i];
                }
            }
            return shortest;
        }

        function issueToken() {
            const selectedValue = document.getElementById('counterSelect').value;
            let targetCounter;

            if(selectedValue === 'auto') {
                targetCounter = getCounterWithShortestQueue();
                showToast(`🤖 ഓട്ടോമാറ്റിക്: കുറഞ്ഞ ക്യൂ ഉള്ള കൗണ്ടർ ${targetCounter.id} ലേക്ക് അയക്കുന്നു...`);
            } else {
                const counterId = parseInt(selectedValue);
                targetCounter = counters.find(c => c.id === counterId);
            }

            // Generate Token Number
            const tokenId = nextTokenIds[targetCounter.id]++;
            const tokenNumber = `C${targetCounter.id}-${tokenId.toString().padStart(3, '0')}`;
            
            const token = {
                number: tokenNumber,
                counterId: targetCounter.id,
                issuedAt: new Date(),
                status: 'waiting'
            };

            targetCounter.queue.push(token);
            allTokens.push(token);

            // Show Token on Screen (Toast notification)
            showToast(`✅ ടോക്കൺ നമ്പർ: ${tokenNumber}\n📌 കൗണ്ടർ: ${targetCounter.id}\n⏳ നിങ്ങളുടെ മുൻപിൽ ${targetCounter.queue.length - 1} പേർ`, 5000);

            // Update display
            renderCounters();
            updateStats();

            // Speak the token (optional)
            speak(`ടോക്കൺ ${tokenNumber}, കൗണ്ടർ ${targetCounter.id} ലേക്ക്`);
        }

        function callNext(counterId) {
            const counter = counters.find(c => c.id === counterId);
            
            if(counter.queue.length === 0) {
                showToast(`⚠️ കൗണ്ടർ ${counterId} ൽ ടോക്കണുകൾ ഇല്ല`, 2000);
                return;
            }

            const nextToken = counter.queue.shift();
            
            // If there was a current token, move to served
            if(counter.currentToken) {
                counter.servedCount++;
            }
            
            counter.currentToken = nextToken;
            nextToken.status = 'serving';
            
            // Announce
            speak(`കൗണ്ടർ ${counterId} ലേക്ക്, ടോക്കൺ ${nextToken.number}`);
            showToast(`🔔 കൗണ്ടർ ${counterId}: ${nextToken.number} നെ വിളിക്കുന്നു...`, 3000);
            
            renderCounters();
            updateStats();
        }

        function resetCurrent(counterId) {
            const counter = counters.find(c => c.id === counterId);
            
            if(!counter.currentToken) {
                showToast(`⚠️ കൗണ്ടർ ${counterId} ൽ നിലവിൽ ടോക്കൺ ഇല്ല`, 2000);
                return;
            }
            
            // Move current token back to queue front
            counter.queue.unshift(counter.currentToken);
            counter.currentToken = null;
            
            showToast(`↩️ കൗണ്ടർ ${counterId}: നിലവിലെ ടോക്കൺ വീണ്ടും ക്യൂവിൽ ചേർത്തു`, 2000);
            renderCounters();
            updateStats();
        }

        function renderCounters() {
            const grid = document.getElementById('countersGrid');
            grid.innerHTML = '';
            
            counters.forEach(counter => {
                const card = document.createElement('div');
                card.className = 'counter-card';
                
                const queuePreview = counter.queue.slice(0, 3).map(t => t.number).join(', ');
                const moreCount = counter.queue.length > 3 ? ` + ${counter.queue.length - 3} more` : '';
                
                card.innerHTML = `
                    <div class="counter-header">
                        <h3>🏪 കൗണ്ടർ ${counter.id}</h3>
                        <small>${counter.name}</small>
                    </div>
                    <div class="current-token">
                        <div class="label">നിലവിലെ ടോക്കൺ</div>
                        <div class="token-number">${counter.currentToken ? counter.currentToken.number : '---'}</div>
                    </div>
                    <div class="queue-info">
                        📋 ക്യൂവിൽ: <span>${counter.queue.length}</span> പേർ
                    </div>
                    <div class="action-buttons">
                        <button class="next-btn" onclick="callNext(${counter.id})">⏩ അടുത്തത്</button>
                        <button class="reset-btn" onclick="resetCurrent(${counter.id})">🔄 റീസെറ്റ്</button>
                    </div>
                    ${counter.queue.length > 0 ? `
                        <div class="queue-list">
                            <h4>അടുത്ത ടോക്കണുകൾ:</h4>
                            <div class="queue-item">${queuePreview}${moreCount}</div>
                        </div>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        function updateStats() {
            const total = allTokens.length;
            const waiting = counters.reduce((sum, c) => sum + c.queue.length, 0);
            const completed = counters.reduce((sum, c) => sum + c.servedCount, 0) + 
                             (counters.filter(c => c.currentToken).length);
            
            document.getElementById('totalTokens').textContent = total;
            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('completedCount').textContent = completed;
        }

        function showToast(message, duration = 3000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.whiteSpace = 'pre-line';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, duration);
        }

        function speak(message) {
            if('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = 'ml-IN';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // Auto-refresh every second
        setInterval(() => {
            renderCounters();
            updateStats();
        }, 1000);

        // Initial render
        renderCounters();
        updateStats();

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT') {
                issueToken();
            }
        });
    </script>
</body>
</html>
