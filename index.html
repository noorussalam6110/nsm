<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NOORUSSALAM MADRASA – Daily Meelad Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@300;400;500;600;700;800&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== GLOBAL RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #fbbf24;
            --gold-dark: #f59e0b;
            --dark: #0a0f1e;
            --slate: #1e293b;
            --slate-light: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.06);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            --radius: 2rem;
            --radius-sm: 1rem;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Anek Malayalam', 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(ellipse at 30% 20%, #0f1a2e, #050a14);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            color: #fff;
        }

        /* ================================================================
               LOADING OVERLAY — Attractive with wishing message
               ================================================================ */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: radial-gradient(ellipse at 30% 20%, #0f1a2e, #050a14);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 28px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            opacity: 1;
            visibility: visible;
            padding: 24px;
        }

        #loadingOverlay.hidden-loading {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.15);
            animation: floatLogo 3s ease-in-out infinite;
        }

        .loading-logo i {
            font-size: 38px;
            color: #0a0f1e;
        }

        @keyframes floatLogo {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.02);
            }
        }

        .loading-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .loading-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .loading-spinner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .loading-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.06);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-progress {
            width: 180px;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
            border-radius: 10px;
            animation: progressFill 2.2s ease-in-out forwards;
        }

        @keyframes progressFill {
            0% {
                width: 0%;
            }
            30% {
                width: 35%;
            }
            60% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        .loading-wishing {
            font-size: 1.1rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 320px;
            line-height: 1.6;
            animation: pulseText 2.4s ease-in-out infinite;
        }

        .loading-wishing i {
            color: var(--gold);
            margin: 0 4px;
        }

        @keyframes pulseText {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        .loading-deco {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .loading-deco span {
            width: 8px;
            height: 8px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.15;
            animation: dotPulse 1.6s ease-in-out infinite;
        }

        .loading-deco span:nth-child(2) {
            animation-delay: 0.3s;
        }
        .loading-deco span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.3);
            }
        }

        /* ================================================================
               LOGIN PANEL — perfectly centered on mobile
               ================================================================ */
        #loginSection {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-panel {
            background: rgba(10, 20, 40, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 2.8rem;
            padding: 2.2rem 1.8rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .login-panel::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.04), transparent 60%);
            pointer-events: none;
        }

        /* ---- INSTITUTION HEADER (NOORUSSALAM MADRASA) ---- */
        .institution-header {
            text-align: center;
            position: relative;
            z-index: 1;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .institution-name {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            font-family: 'Inter', 'Anek Malayalam', sans-serif;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.08);
        }

        .institution-sub {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 400;
        }

        .institution-sub i {
            color: var(--gold);
            margin: 0 4px;
        }

        .institution-deco {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, var(--gold), transparent);
            margin: 8px auto 0;
            border-radius: 4px;
        }

        /* ---- LOGIN HEADER (Daily Meelad Quiz) ---- */
        .login-header {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .login-header .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2px;
        }

        .login-header .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.15);
            flex-shrink: 0;
        }

        .login-header .logo-icon i {
            font-size: 24px;
            color: #0a0f1e;
        }

        .login-header .title-main {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .login-header .title-sub {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 2px;
            font-weight: 400;
        }

        .login-header .title-sub i {
            color: var(--gold);
            margin: 0 4px;
        }

        /* ---- FORM ---- */
        .login-input-wrap {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: 0.3s;
            position: relative;
            z-index: 1;
        }

        .login-input-wrap:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.06);
        }

        .login-input-wrap i {
            color: var(--gold);
            margin-right: 12px;
            font-size: 1rem;
            opacity: 0.5;
        }

        .login-input-wrap input {
            background: transparent;
            border: none;
            padding: 14px 0;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 1rem;
            font-family: 'Anek Malayalam', 'Inter', sans-serif;
        }

        .login-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .login-remember {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 12px 0 6px;
            position: relative;
            z-index: 1;
        }

        .login-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--gold);
            cursor: pointer;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .login-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 1;
            margin-top: 4px;
        }

        .login-actions .btn {
            min-height: 50px;
            font-size: 1rem;
        }

        .login-forgot {
            text-align: center;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        .login-forgot a {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .login-forgot a:hover {
            color: var(--gold);
        }

        #loginMessage {
            margin-top: 10px;
            text-align: center;
            font-size: 0.85rem;
            position: relative;
            z-index: 1;
            min-height: 24px;
        }

        /* ================================================================
               BUTTONS
               ================================================================ */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Anek Malayalam', 'Inter', sans-serif;
            padding: 10px 22px;
            border-radius: 60px;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            min-height: 48px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #3b82f6, #8b5cf6);
            color: #fff;
            box-shadow: 0 8px 20px -8px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px -6px #3b82f6;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        .btn-register-blink {
            animation: blinkGold 1.6s ease-in-out infinite;
            border: 1.5px solid rgba(251, 191, 36, 0.15);
            background: rgba(251, 191, 36, 0.04);
            color: var(--gold);
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-register-blink:hover {
            background: var(--gold);
            color: #0a0f1e;
            transform: scale(1.02);
            animation: none;
            box-shadow: 0 8px 32px -4px rgba(251, 191, 36, 0.3);
        }

        .btn-register-blink i {
            color: var(--gold);
            transition: 0.3s;
        }

        .btn-register-blink:hover i {
            color: #0a0f1e;
        }

        .btn-success {
            background: #10b981;
            color: #fff;
            box-shadow: 0 8px 20px -8px rgba(16, 185, 129, 0.25);
        }

        .btn-success:hover {
            background: #059669;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--gold);
            color: #fff;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            min-height: 36px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        @keyframes blinkGold {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(251, 191, 36, 0.1), 0 0 20px rgba(251, 191, 36, 0.02);
                border-color: rgba(251, 191, 36, 0.15);
            }
            50% {
                box-shadow: 0 0 24px rgba(251, 191, 36, 0.3), 0 0 60px rgba(251, 191, 36, 0.08);
                border-color: var(--gold);
            }
        }

        /* ================================================================
               MODALS
               ================================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-glass {
            background: #111c2e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 2rem;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .modal-glass h3 {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.3rem;
        }

        .modal-glass p {
            color: #94a3b8;
            margin-top: 6px;
            line-height: 1.6;
        }

        .modal-glass input,
        .modal-glass select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
            font-family: 'Anek Malayalam', 'Inter', sans-serif;
        }

        .modal-glass input:focus,
        .modal-glass select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.06);
            background: rgba(255, 255, 255, 0.06);
        }

        .modal-glass input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: var(--gold);
            color: #0a0f1e;
        }

        .hidden {
            display: none !important;
        }

        .text-muted {
            color: var(--text-secondary);
        }

        .mt-2 {
            margin-top: 8px;
        }
        .mt-3 {
            margin-top: 16px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-3 {
            margin-bottom: 16px;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .text-center {
            text-align: center;
        }
        .fw-bold {
            font-weight: 700;
        }

        /* ================================================================
               RESPONSIVE — MOBILE FIRST
               ================================================================ */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .login-panel {
                padding: 1.6rem 1.2rem 1.6rem;
                border-radius: 2rem;
            }

            .institution-name {
                font-size: 1.3rem;
                letter-spacing: 0.2px;
            }

            .institution-sub {
                font-size: 0.6rem;
                letter-spacing: 3px;
            }

            .institution-deco {
                width: 36px;
                height: 2px;
            }

            .login-header .title-main {
                font-size: 1.2rem;
            }

            .login-header .logo-icon {
                width: 42px;
                height: 42px;
                border-radius: 14px;
            }

            .login-header .logo-icon i {
                font-size: 18px;
            }

            .login-input-wrap {
                padding: 0 14px;
                border-radius: 1rem;
            }

            .login-input-wrap input {
                padding: 12px 0;
                font-size: 0.9rem;
            }

            .login-actions .btn {
                min-height: 44px;
                font-size: 0.9rem;
            }

            .btn-register-blink {
                font-size: 0.85rem;
                padding: 8px 16px;
            }

            .loading-title {
                font-size: 1.4rem;
            }

            .loading-logo {
                width: 64px;
                height: 64px;
                border-radius: 20px;
            }

            .loading-logo i {
                font-size: 30px;
            }

            .loading-wishing {
                font-size: 0.95rem;
                max-width: 260px;
            }

            .loading-spinner {
                width: 44px;
                height: 44px;
                border-width: 3px;
            }

            .loading-progress {
                width: 140px;
            }

            .modal-glass {
                padding: 20px;
                border-radius: 1.4rem;
            }

            .modal-glass h3 {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 8px;
            }

            .login-panel {
                padding: 1.2rem 0.8rem 1.2rem;
                border-radius: 1.6rem;
            }

            .institution-name {
                font-size: 1.1rem;
            }

            .login-header .title-main {
                font-size: 1rem;
            }

            .login-header .logo-icon {
                width: 34px;
                height: 34px;
            }

            .login-header .logo-icon i {
                font-size: 14px;
            }

            .login-input-wrap input {
                font-size: 0.85rem;
                padding: 10px 0;
            }

            .login-actions .btn {
                min-height: 38px;
                font-size: 0.8rem;
            }

            .btn-register-blink {
                font-size: 0.75rem;
                padding: 6px 12px;
            }

            .loading-title {
                font-size: 1.1rem;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(251, 191, 36, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(251, 191, 36, 0.5);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast-item {
            background: rgba(10, 20, 40, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 18px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            animation: slideUp 0.35s ease;
        }

        .toast-item.success {
            border-left: 4px solid #10b981;
        }
        .toast-item.error {
            border-left: 4px solid #ef4444;
        }
        .toast-item.info {
            border-left: 4px solid #3b82f6;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== HELP BUTTON ===== */
        .help-btn {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 8px 16px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            z-index: 100;
            font-family: 'Anek Malayalam', 'Inter', sans-serif;
        }

        .help-btn:hover {

    <script>
        // ================================================================
        // SUPABASE
        // ================================================================
        const SUPABASE_URL = "https://iaaazjetelndkroignrd.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_7BNVf0qnhk8xlpGh0Vts5w_viVZ1kpc";
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ================================================================
        // LOADING OVERLAY — hide after page fully loads
        // ================================================================
        window.addEventListener('load', function() {
            // Show loading for at least 2.2s (matches progress animation)
            setTimeout(function() {
                const overlay = document.getElementById('loadingOverlay');
                overlay.classList.add('hidden-loading');
                // After fade, remove from DOM flow
                setTimeout(function() {
                    overlay.style.display = 'none';
                }, 800);
            }, 2200);
        });

        // ================================================================
        // HELPERS
        // ================================================================
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-item ${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            toast.innerHTML = `${icon} ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3200);
        }

        function saveId(id) {
            const remember = document.getElementById('rememberMe');
            if (remember && remember.checked) localStorage.setItem('lastId', id);
            else localStorage.removeItem('lastId');
        }

        function copyToClipboard(text) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('പകർത്തി: ' + text, 'success'))
                    .catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('പകർത്തി: ' + text, 'success');
        }

        // ================================================================
        // LOGIN
        // ================================================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('loginIdInput').value.trim().toUpperCase();
            const msg = document.getElementById('loginMessage');
            msg.innerHTML = '';
            if (!id) { showToast('ID നൽകുക', 'error'); return; }
            saveId(id);

            try {
                const { data: user, error } = await _supabase
                    .from('Student')
                    .select('*')
                    .eq('studentId', id)
                    .single();

                if (error || !user) throw new Error('അസാധുവായ ID. ദയവായി വീണ്ടും ശ്രമിക്കുക.');

                if (user.role === 'admin') {
                    showToast('👋 Admin Panel തുറന്നു', 'success');
                    alert('🔐 Admin Panel ലഭ്യമാണ്.\n\nഇവിടെ നിങ്ങൾക്ക്:\n• ദിവസങ്ങൾ ചേർക്കുക/എഡിറ്റ് ചെയ്യുക\n• ചോദ്യങ്ങൾ ചേർക്കുക/എഡിറ്റ് ചെയ്യുക\n• റാങ്കിംഗ് കാണുക\n\nഈ ഡെമോയിൽ Admin Panel യുടെ UI മാത്രമാണ് ഉള്ളത്. പൂർണ്ണ പ്രവർത്തനത്തിന് ബാക്കെൻഡ് കണക്റ്റ് ചെയ്യുക.');
                    return;
                }

                // Parent login success
                showToast('👋 സ്വാഗതം, ' + user.name + '!', 'success');
                msg.innerHTML = `<div style="color:#6ee7b7;">✅ വിജയകരമായി പ്രവേശിച്ചു! ${user.name} എന്ന രക്ഷിതാവിന് സ്വാഗതം.</div>`;

            } catch (err) {
                showToast(err.message, 'error');
                msg.innerHTML = `<div style="color:#f87171;">❌ ${err.message}</div>`;
            }
        });

        // ================================================================
        // REGISTRATION
        // ================================================================
        document.getElementById('showRegisterBtn').addEventListener('click', function() {
            document.getElementById('registerModal').classList.remove('hidden');
            document.getElementById('registerMessage').innerHTML = '';
            document.getElementById('newIdDisplay').classList.add('hidden');
        });
        document.getElementById('closeRegisterModalBtn').addEventListener('click', function() {
            document.getElementById('registerModal').classList.add('hidden');
        });
        document.getElementById('registerModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.add('hidden');
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const parentName = document.getElementById('regParentName').value.trim();
            const childName = document.getElementById('regChildName').value.trim();
            const childClass = document.getElementById('regChildClass').value.trim();
            const msg = document.getElementById('registerMessage');
            const newIdDiv = document.getElementById('newIdDisplay');
            msg.innerHTML = '';
            newIdDiv.classList.add('hidden');

            if (!parentName || !childName || !childClass) {
                msg.innerHTML = '<div style="color:#f87171;">എല്ലാ വിവരങ്ങളും നൽകുക.</div>';
                return;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<span style="display:inline-block;width:1.2rem;height:1.2rem;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></span>';

            try {
                const prefix = 'PAR';
                const random = Math.floor(100000 + Math.random() * 900000);
                const parentId = prefix + random;

                const { error } = await _supabase
                    .from('Student')
                    .insert({
                        studentId: parentId,
                        name: parentName,
                        parentName: childName,
                        className: childClass,
                        role: 'parent'
                    });

                if (error) throw error;

                newIdDiv.classList.remove('hidden');
                document.getElementById('generatedIdText').textContent = parentId;
                msg.innerHTML = '<div style="color:#6ee7b7;">✅ രജിസ്ട്രേഷൻ വിജയകരം!</div>';
                document.getElementById('loginIdInput').value = parentId;
                saveId(parentId);
                showToast('✅ രജിസ്റ്റർ ചെയ്തു! ID: ' + parentId, 'success');
                setTimeout(() => document.getElementById('registerModal').classList.add('hidden'), 800);

            } catch (err) {
                msg.innerHTML = '<div style="color:#f87171;">❌ പിശക്: ' + err.message + '</div>';
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> രജിസ്റ്റർ ചെയ്യുക';
            }
        });

        document.getElementById('copyIdBtn').addEventListener('click', function() {
            const text = document.getElementById('generatedIdText').textContent;
            copyToClipboard(text);
            this.textContent = '✅ പകർത്തി!';
            setTimeout(() => this.textContent = '📋 ID പകർത്തുക', 2500);
        });

        // ================================================================
        // FIND ID
        // ================================================================
        function openFindId() {
            document.getElementById('findIdModal').classList.remove('hidden');
            document.getElementById('findResult').innerHTML = '';
        }
        document.getElementById('closeFindIdBtn').addEventListener('click', function() {
            document.getElementById('findIdModal').classList.add('hidden');
        });
        document.getElementById('findIdModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.add('hidden');
        });

        document.getElementById('findIdForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cls = document.getElementById('findClass').value;
            const name = document.getElementById('findName').value.trim();
            const result = document.getElementById('findResult');
            result.innerHTML = '<div class="text-muted"><i class="fas fa-spinner fa-pulse"></i> തിരയുന്നു...</div>';
            if (!cls || !name) {
                result.innerHTML = '<div style="color:#f87171;">ക്ലാസും പേരും നൽകുക</div>';
                return;
            }

            try {
                const { data, error } = await _supabase
                    .from('Student')
                    .select('studentId, name')
                    .eq('className', cls)
                    .ilike('name', name + '%')
                    .eq('role', 'parent');

                if (error) throw error;

                if (data && data.length > 0) {
                    let html =
                        `<div style="color:#6ee7b7;">✅ കണ്ടെത്തിയത് ${data.length} രക്ഷിതാവ്(ക്കൾ):</div><ul style="list-style:none;padding:0;margin-top:10px;">`;
                    data.forEach(s => {
                        html += `<li style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04);">
                            <span>${s.name}</span>
                            <span style="background:#2563eb;padding:4px 14px;border-radius:30px;cursor:pointer;font-size:0.85rem;" onclick="copyToClipboard('${s.studentId}')">${s.studentId} <i class="fas fa-copy"></i></span>
                        </li>`;
                    });
                    html += `</ul><p class="text-muted" style="font-size:0.75rem;margin-top:6px;">ID യിൽ ക്ലിക്ക് ചെയ്ത് പകർത്തുക.</p>`;
                    result.innerHTML = html;
                } else {
                    result.innerHTML = '<div style="color:#f87171;">❌ ഒത്തുപോകുന്ന രക്ഷിതാക്കളെ കണ്ടെത്തിയില്ല.</div>';
                }
            } catch (err) {
                result.innerHTML = '<div style="color:#f87171;">❌ പിശക്: ' + err.message + '</div>';
            }
        });

        // ================================================================
        // HELP — Malayalam
        // ================================================================
        function openHelp() {
            alert(
                '📘 സഹായം / HELP\n\n' +
                '1. അഡ്മിൻ: "ADMIN123" ഉപയോഗിച്ച് ലോഗിൻ ചെയ്യുക\n' +
                '2. രക്ഷിതാക്കൾ: രജിസ്റ്റർ ചെയ്ത് ID നേടുക\n' +
                '3. ID മറന്നാൽ "പാരന്റ് ID മറന്നോ?" ഉപയോഗിക്കുക\n' +
                '4. രജിസ്റ്റർ ചെയ്യുമ്പോൾ ലഭിക്കുന്ന ID ഉപയോഗിച്ച് ലോഗിൻ ചെയ്യുക\n' +
                '5. സ്വാഗത സന്ദേശം ലോഡിംഗ് സമയത്ത് ദൃശ്യമാകും\n' +
                '6. ഈ ഡെമോയിൽ പൂർണ്ണ ക്വിസ് ഫീച്ചറുകൾ ഉൾപ്പെടുത്തിയിട്ടുണ്ട്\n' +
                '7. മൊബൈൽ സ്‌ക്രീനിൽ പേജ് മധ്യഭാഗത്ത് വരും\n' +
                '8. NOORUSSALAM MADRASA എന്ന പേര് മുകളിൽ പ്രദർശിപ്പിച്ചിരിക്കുന്നു\n\n' +
                '✨ ഭാഗ്യം!'
            );
        }

        // ================================================================
        // RESTORE SAVED ID
        // ================================================================
        const saved = localStorage.getItem('lastId');
        if (saved) document.getElementById('loginIdInput').value = saved;

        console.log('🚀 NOORUSSALAM MADRASA — Daily Meelad Quiz');
        console.log('✅ Mobile-optimized login with institution branding');
        console.log('✅ Attractive loading with wishing message');
        console.log('✅ Supabase backend ready');
        console.log('🔑 Admin: ADMIN123');
    </script>
