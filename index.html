<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>14 കൗണ്ടർ അഡ്മിൻ | നെക്സ്റ്റ് + മാനുവൽ ടോക്കൺ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Malayalam', system-ui, sans-serif;
            background: #0f0c29;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Login Overlay */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }

        .login-box h2 {
            color: #302b63;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1em;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #302b63, #24243e);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-box .error {
            color: red;
            margin-top: 10px;
            font-size: 0.9em;
        }

        /* Main App (hidden until login) */
        .main-app {
            display: none;
        }

        /* Header */
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.5em;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }

        /* Stats Bar */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            color: white;
        }

        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 0.85em;
            opacity: 0.8;
        }

        /* Counters Grid - 14 Counters */
        .counters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .counter-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .counter-card.active-token {
            box-shadow: 0 0 0 3px #4CAF50, 0 10px 30px rgba(0,0,0,0.2);
        }

        .counter-header {
            background: linear-gradient(135deg, #302b63, #24243e);
            color: white;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 15px;
        }

        .counter-header h3 {
            font-size: 1.2em;
        }

        .counter-header small {
            opacity: 0.8;
        }

        .current-token {
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .current-token .label {
            font-size: 0.8em;
            color: #666;
        }

        .current-token .token {
            font-size: 2.2em;
            font-weight: bold;
            font-family: monospace;
            color: #302b63;
        }

        .queue-info {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .manual-input {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .manual-input input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            text-transform: uppercase;
        }

        .manual-input button {
            padding: 10px 15px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-next {
            flex: 2;
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-reset {
            flex: 1;
            background: #ffc107;
            color: #333;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .served-count {
            margin-top: 12px;
            text-align: center;
            font-size: 0.8em;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 700px) {
            .counters-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔐 അഡ്മിൻ ലോഗിൻ</h2>
            <input type="password" id="adminPassword" placeholder="അഡ്മിൻ പാസ്വേഡ്" autocomplete="off">
            <button onclick="login()">പ്രവേശിക്കുക</button>
            <div class="error" id="loginError"></div>
            <p style="margin-top: 20px; font-size: 0.8em; color: #888;">ഡീഫോൾട്ട് പാസ്വേഡ്: <strong>admin123</strong></p>
        </div>
    </div>

    <!-- Main App -->
    <div class="main-app" id="mainApp">
        <div class="header">
            <h1>🏫 സ്കൂൾ അഡ്മിഷൻ 2025 | 14 കൗണ്ടറുകൾ</h1>
            <button class="logout-btn" onclick="logout()">🚪 ലോഗൗട്ട്</button>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card"><div class="value" id="totalTokens">0</div><div class="label">ആകെ ടോക്കൺ</div></div>
            <div class="stat-card"><div class="value" id="activeTokens">0</div><div class="label">🟢 Active (സേവനത്തിൽ)</div></div>
            <div class="stat-card"><div class="value" id="waitingTokens">0</div><div class="label">🟠 Waiting (ക്യൂവിൽ)</div></div>
            <div class="stat-card"><div class="value" id="completedTokens">0</div><div class="label">✅ Completed</div></div>
        </div>

        <!-- 14 Counters Grid -->
        <div class="counters-grid" id="countersGrid"></div>
    </div>

    <script>
        // Admin password
        const ADMIN_PASSWORD = "admin123";
        
        // Data structure for 14 counters
        let counters = [];
        let allTimeServed = 0;
        
        // Initialize 14 admission counters
        for(let i = 1; i <= 14; i++) {
            counters.push({
                id: i,
                name: `അഡ്മിഷൻ കൗണ്ടർ ${i}`,
                currentToken: null,
                queue: [],
                servedCount: 0,
                nextId: 1
            });
        }

        // Load from localStorage
        function loadData() {
            const saved = localStorage.getItem('admissionCounters14');
            if(saved) {
                const data = JSON.parse(saved);
                if(data.counters) {
                    for(let i = 0; i < counters.length; i++) {
                        if(data.counters[i]) {
                            counters[i].queue = data.counters[i].queue || [];
                            counters[i].servedCount = data.counters[i].servedCount || 0;
                            counters[i].nextId = data.counters[i].nextId || 1;
                            counters[i].currentToken = data.counters[i].currentToken || null;
                        }
                    }
                }
                allTimeServed = data.allTimeServed || 0;
            }
        }

        function saveData() {
            const data = {
                counters: counters.map(c => ({
                    queue: c.queue,
                    servedCount: c.servedCount,
                    nextId: c.nextId,
                    currentToken: c.currentToken
                })),
                allTimeServed: allTimeServed
            };
            localStorage.setItem('admissionCounters14', JSON.stringify(data));
        }

        // Generate token number
        function generateTokenNumber(counterId, serialNo) {
            return `C${counterId}-${serialNo.toString().padStart(3, '0')}`;
        }

        // Add manual token to a specific counter
        function addManualToken(counterId) {
            const input = document.getElementById(`manualToken_${counterId}`);
            let tokenNumber = input.value.trim().toUpperCase();
            
            if(!tokenNumber) {
                showToast(`⚠️ കൗണ്ടർ ${counterId}: ടോക്കൺ നമ്പർ എന്റർ ചെയ്യുക`);
                return;
            }
            
            // Validate format
            const tokenRegex = /^C[0-9]+-[0-9]+$/;
            if(!tokenRegex.test(tokenNumber)) {
                showToast(`⚠️ തെറ്റായ ഫോർമാറ്റ്! ഉദാ: C${counterId}-001`);
                return;
            }
            
            const counter = counters.find(c => c.id === counterId);
            
            // Check if token already exists in queue or current
            const exists = counter.queue.some(t => t.number === tokenNumber) || 
                          (counter.currentToken && counter.currentToken.number === tokenNumber);
            
            if(exists) {
                showToast(`⚠️ ${tokenNumber} ഇതിനകം നിലവിലുണ്ട്`);
                return;
            }
            
            // Add to queue
            const token = {
                number: tokenNumber,
                status: 'waiting',
                timestamp: new Date().toLocaleTimeString()
            };
            
            counter.queue.push(token);
            saveData();
            renderCounters();
            updateStats();
            showToast(`✅ ${tokenNumber} കൗണ്ടർ ${counterId} ലേക്ക് ചേർത്തു`, 2000);
            
            input.value = '';
        }

        // Next token - call next person
        function callNext(counterId) {
            const counter = counters.find(c => c.id === counterId);
            
            if(counter.queue.length === 0) {
                showToast(`⚠️ കൗണ്ടർ ${counterId} ൽ ടോക്കൺ ഇല്ല`);
                return;
            }
            
            // If there's a current token, move to completed
            if(counter.currentToken) {
                counter.servedCount++;
                allTimeServed++;
            }
            
            // Get next token from queue
            const nextToken = counter.queue.shift();
            counter.currentToken = nextToken;
            nextToken.status = 'serving';
            nextToken.serveTime = new Date().toLocaleTimeString();
            
            saveData();
            renderCounters();
            updateStats();
            
            // Announce
            speak(`കൗണ്ടർ ${counterId}, ടോക്കൺ ${nextToken.number}`);
            showToast(`🔔 കൗണ്ടർ ${counterId}: ${nextToken.number} വിളിക്കുന്നു`, 3000);
        }

        // Reset current token (send back to queue)
        function resetCurrent(counterId) {
            const counter = counters.find(c => c.id === counterId);
            
            if(!counter.currentToken) {
                showToast(`⚠️ കൗണ്ടർ ${counterId} ൽ നിലവിൽ ടോക്കൺ ഇല്ല`);
                return;
            }
            
            const token = counter.currentToken;
            token.status = 'waiting';
            counter.queue.unshift(token);
            counter.currentToken = null;
            
            saveData();
            renderCounters();
            updateStats();
            showToast(`↩️ ${token.number} വീണ്ടും ക്യൂവിൽ ചേർത്തു`, 2000);
        }

        // Complete current token without next
        function completeCurrent(counterId) {
            const counter = counters.find(c => c.id === counterId);
            
            if(!counter.currentToken) {
                showToast(`⚠️ കൗണ്ടർ ${counterId} ൽ നിലവിൽ ടോക്കൺ ഇല്ല`);
                return;
            }
            
            counter.servedCount++;
            allTimeServed++;
            counter.currentToken = null;
            
            saveData();
            renderCounters();
            updateStats();
            showToast(`✅ കൗണ്ടർ ${counterId}: നിലവിലെ ടോക്കൺ completed`, 1500);
        }

        // Render all 14 counters
        function renderCounters() {
            const grid = document.getElementById('countersGrid');
            if(!grid) return;
            
            grid.innerHTML = '';
            
            counters.forEach(counter => {
                const queuePreview = counter.queue.slice(0, 3).map(t => t.number).join(', ');
                const moreCount = counter.queue.length > 3 ? ` + ${counter.queue.length - 3}` : '';
                const isActive = counter.currentToken !== null;
                
                const card = document.createElement('div');
                card.className = `counter-card ${isActive ? 'active-token' : ''}`;
                card.innerHTML = `
                    <div class="counter-header">
                        <h3>🏪 കൗണ്ടർ ${counter.id}</h3>
                        <small>${counter.name}</small>
                    </div>
                    <div class="current-token">
                        <div class="label">📌 നിലവിലെ ടോക്കൺ</div>
                        <div class="token">${counter.currentToken ? counter.currentToken.number : '---'}</div>
                        ${counter.currentToken ? `<small>⏰ ${counter.currentToken.serveTime || counter.currentToken.timestamp}</small>` : ''}
                    </div>
                    <div class="queue-info">
                        🟠 ക്യൂവിൽ: ${counter.queue.length} ടോക്കൺ
                    </div>
                    <div class="manual-input">
                        <input type="text" id="manualToken_${counter.id}" placeholder="C${counter.id}-001" autocomplete="off">
                        <button onclick="addManualToken(${counter.id})">➕ ചേർക്കുക</button>
                    </div>
                    <div class="action-buttons">
                        <button class="btn-next" onclick="callNext(${counter.id})">⏩ നെക്സ്റ്റ് (Next)</button>
                        <button class="btn-reset" onclick="resetCurrent(${counter.id})">🔄 Reset</button>
                    </div>
                    <div class="action-buttons" style="margin-top: 8px;">
                        <button class="btn-reset" style="background:#17a2b8; color:white;" onclick="completeCurrent(${counter.id})">✅ Complete</button>
                    </div>
                    <div class="served-count">
                        ✅ സേവനം പൂർത്തിയായത്: ${counter.servedCount}
                    </div>
                    ${queuePreview ? `
                        <div style="margin-top: 10px; font-size: 0.75em; color: #666; border-top: 1px solid #eee; padding-top: 8px;">
                            📋 അടുത്തത്: ${queuePreview}${moreCount}
                        </div>
                    ` : ''}
                `;
                grid.appendChild(card);
            });
        }

        // Update statistics
        function updateStats() {
            const total = counters.reduce((sum, c) => sum + c.servedCount + (c.currentToken ? 1 : 0) + c.queue.length, 0);
            const active = counters.filter(c => c.currentToken !== null).length;
            const waiting = counters.reduce((sum, c) => sum + c.queue.length, 0);
            const completed = counters.reduce((sum, c) => sum + c.servedCount, 0);
            
            document.getElementById('totalTokens').textContent = total;
            document.getElementById('activeTokens').textContent = active;
            document.getElementById('waitingTokens').textContent = waiting;
            document.getElementById('completedTokens').textContent = completed;
        }

        // Auto refresh display
        function refreshDisplay() {
            renderCounters();
            updateStats();
        }

        // Toast message
        function showToast(message, duration = 2000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }

        // Speech announcement
        function speak(message) {
            if('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.lang = 'ml-IN';
                utterance.rate = 0.85;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // Login function
        function login() {
            const password = document.getElementById('adminPassword').value;
            if(password === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                loadData();
                refreshDisplay();
            } else {
                document.getElementById('loginError').textContent = 'തെറ്റായ പാസ്വേഡ്! ശ്രമിക്കുക: admin123';
            }
        }

        // Logout function
        function logout() {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').textContent = '';
        }

        // Enter key support for manual inputs (dynamic)
        function setupEnterKeys() {
            // Will be called after each render
            for(let i = 1; i <= 14; i++) {
                const input = document.getElementById(`manualToken_${i}`);
                if(input) {
                    input.onkeypress = (e) => {
                        if(e.key === 'Enter') {
                            addManualToken(i);
                        }
                    };
                }
            }
        }

        // Override render to setup enter keys
        const originalRender = renderCounters;
        renderCounters = function() {
            originalRender();
            setTimeout(setupEnterKeys, 50);
        };

        // Auto refresh every second
        setInterval(() => {
            if(document.getElementById('mainApp').style.display === 'block') {
                refreshDisplay();
            }
        }, 1000);

        // Initial check
        if(localStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            loadData();
            refreshDisplay();
        }
    </script>
</body>
</html>
