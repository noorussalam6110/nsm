<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Logout Button</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ===== BUTTON ===== */
        .logoutButton {
            position: relative;
            width: 160px;
            height: 58px;
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 12px;
            background: #20263c;
            transition: .3s;
            color: #fff;
            box-shadow:
                0 10px 25px rgba(0, 0, 0, .25),
                0 4px 10px rgba(0, 0, 0, .15);

            /* walking custom properties – set by JS */
            --arm1: rotate(0deg);
            --wrist1: rotate(0deg);
            --arm2: rotate(0deg);
            --wrist2: rotate(0deg);
            --leg1: rotate(0deg);
            --calf1: rotate(0deg);
            --leg2: rotate(0deg);
            --calf2: rotate(0deg);
        }

        .logoutButton:hover {
            background: #2a3150;
            box-shadow:
                0 16px 35px rgba(0, 0, 0, .35),
                0 8px 18px rgba(0, 0, 0, .2);
        }

        .logoutButton:active {
            transform: scale(.97);
        }

        /* ===== TEXT ===== */
        .button-text {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: 100;
            letter-spacing: .4px;
            z-index: 10;
        }

        /* ===== SVG BASE ===== */
        svg {
            position: absolute;
            display: block;
            overflow: visible;
        }

        /* ===== DOOR FRAME ===== */
        .doorway {
            width: 40px;
            right: 22px;
            bottom: 10px;
            fill: #d7dce6;
            z-index: 3;
        }

        /* ===== DOOR ===== */
        .door {
            width: 50px;
            right: 21px;
            bottom: 5px;
            fill: #4d7cff;
            transition: .45s ease;
            transform: rotateY(20deg);
            transform-origin: 100% 50%;
            transform-style: preserve-3d;
            z-index: 5;
        }

        .door path {
            fill: #4d7cff;
            stroke: #4371f7;
            stroke-width: 4;
        }

        .door circle {
            fill: #ffffff;
        }

        /* ===== PERSON ===== */
        .figure {
            position: absolute;
            width: 38px;
            right: 32px;
            bottom: 11px;
            fill: #4e7bf8;
            transform-origin: center;
            transition:
                transform .8s linear,
                opacity .7s;
            z-index: 9;
        }

        /* ===== HOVER ===== */
        .logoutButton:hover .door {
            transform: perspective(300px) rotateY(45deg);
        }

        /* ===== WALK ===== */
        .logoutButton.walk .figure {
            transform: translateX(20px);
        }

        .logoutButton.walk .door {
            transform: perspective(300px) rotateY(75deg);
        }

        /* ===== FALL ===== */
        .logoutButton.fall {
            animation: shake .25s;
        }

        .logoutButton.fall .figure {
            animation: spin 1s linear infinite;
            bottom: -1080px;
            right: 1px;
            opacity: 1;
            transition:
                bottom 1s ease-in,
                opacity .5s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg) scale(.94);
            }
            to {
                transform: rotate(360deg) scale(.94);
            }
        }

        /* ===== BANG ===== */
        .bang {
            opacity: 0;
            fill: #ffcf33;
        }

        .logoutButton.fall .bang {
            animation: flash .85s;
            animation-delay: .2s;
        }

        /* ===== KEYFRAMES ===== */
        @keyframes shake {
            0%,
            100% {
                transform: rotate(0);
            }
            20% {
                transform: rotate(-2deg);
            }
            40% {
                transform: rotate(2deg);
            }
            60% {
                transform: rotate(-2deg);
            }
            80% {
                transform: rotate(2deg);
            }
        }

        @keyframes flash {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* ===== WALKING LIMBS ===== */
        .arm1 {
            transform: var(--arm1);
            transform-origin: 52% 45%;
            transition: .12s linear;
        }
        .wrist1 {
            transform: var(--wrist1);
            transform-origin: 59% 55%;
            transition: .12s linear;
        }
        .arm2 {
            transform: var(--arm2);
            transform-origin: 47% 43%;
            transition: .12s linear;
        }
        .wrist2 {
            transform: var(--wrist2);
            transform-origin: 35% 47%;
            transition: .12s linear;
        }
        .leg1 {
            transform: var(--leg1);
            transform-origin: 47% 64.5%;
            transition: .12s linear;
        }
        .calf1 {
            transform: var(--calf1);
            transform-origin: 55.5% 71.5%;
            transition: .12s linear;
        }
        .leg2 {
            transform: var(--leg2);
            transform-origin: 43% 63%;
            transition: .12s linear;
        }
        .calf2 {
            transform: var(--calf2);
            transform-origin: 41.5% 73%;
            transition: .12s linear;
        }
    </style>
</head>

<body>

    <div class="container">

        <button class="logoutButton">

            <span class="button-text">Log Out -</span>

            <!-- SVG artwork inspired by Nick's original CodePen -->
            <svg class="doorway" viewBox="0 0 100 100">
                <path d="M93.4 86.3H58.6c-1.9 0-3.4-1.5-3.4-3.4V17.1c0-1.9 1.5-3.4 3.4-3.4h34.8c1.9 0 3.4 1.5 3.4 3.4v65.8c0 1.9-1.5 3.4-3.4 3.4z" />
                <path class="bang" d="M40.5 43.7L26.6 31.4l-2.5 6.7zM41.9 50.4l-19.5-4-1.4 6.3zM40 57.4l-17.7 3.9 3.9 5.7z" />
            </svg>

            <svg class="figure" viewBox="0 0 100 100">
                <circle cx="52.1" cy="32.4" r="6.4" />
                <path d="M50.7 62.8c-1.2 2.5-3.6 5-7.2 4-3.2-.9-4.9-3.5-4-7.8.7-3.4 3.1-13.8 4.1-15.8 1.7-3.4 1.6-4.6 7-3.7 4.3.7 4.6 2.5 4.3 5.4-.4 3.7-2.8 15.1-4.2 17.9z" />
                <g class="arm1">
                    <path d="M55.5 56.5l-6-9.5c-1-1.5-.6-3.5.9-4.4 1.5-1 3.7-1.1 4.6.4l6.1 10c1 1.5.3 3.5-1.1 4.4-1.5.9-3.5.5-4.5-.9z" />
                    <path class="wrist1" d="M69.4 59.9L58.1 58c-1.7-.3-2.9-1.9-2.6-3.7.3-1.7 1.9-2.9 3.7-2.6l11.4 1.9c1.7.3 2.9 1.9 2.6 3.7-.4 1.7-2 2.9-3.8 2.6z" />
                </g>
                <g class="arm2">
                    <path d="M34.2 43.6L45 40.3c1.7-.6 3.5.3 4 2 .6 1.7-.3 4-2 4.5l-10.8 2.8c-1.7.6-3.5-.3-4-2-.6-1.6.3-3.4 2-4z" />
                    <path class="wrist2" d="M27.1 56.2L32 45.7c.7-1.6 2.6-2.3 4.2-1.6 1.6.7 2.3 2.6 1.6 4.2L33 58.8c-.7 1.6-2.6 2.3-4.2 1.6-1.7-.7-2.4-2.6-1.7-4.2z" />
                </g>
                <g class="leg1">
                    <path d="M52.1 73.2s-7-5.7-7.9-6.5c-.9-.9-1.2-3.5-.1-4.9 1.1-1.4 3.8-1.9 5.2-.9l7.9 7c1.4 1.1 1.7 3.5.7 4.9-1.1 1.4-4.4 1.5-5.8.4z" />
                    <path class="calf1" d="M52.6 84.4l-1-12.8c-.1-1.9 1.5-3.6 3.5-3.7 2-.1 3.7 1.4 3.8 3.4l1 12.8c.1 1.9-1.5 3.6-3.5 3.7-2 0-3.7-1.5-3.8-3.4z" />
                </g>
                <g class="leg2">
                    <path d="M37.8 72.7s1.3-10.2 1.6-11.4 2.4-2.8 4.1-2.6c1.7.2 3.6 2.3 3.4 4l-1.8 11.1c-.2 1.7-1.7 3.3-3.4 3.1-1.8-.2-4.1-2.4-3.9-4.2z" />
                    <path class="calf2" d="M29.5 82.3l9.6-10.9c1.3-1.4 3.6-1.5 5.1-.1 1.5 1.4.4 4.9-.9 6.3l-8.5 9.6c-1.3 1.4-3.6 1.5-5.1.1-1.4-1.3-1.5-3.5-.2-5z" />
                </g>
            </svg>

            <svg class="door" viewBox="0 0 100 100">
                <path d="M93.4 86.3H58.6c-1.9 0-3.4-1.5-3.4-3.4V17.1c0-1.9 1.5-3.4 3.4-3.4h34.8c1.9 0 3.4 1.5 3.4 3.4v65.8c0 1.9-1.5 3.4-3.4 3.4z" />
                <circle cx="66" cy="50" r="3.7" />
            </svg>

        </button>

    </div>

    <script>
        const button = document.querySelector(".logoutButton");

        let pose = false;
        let walkInterval = null;

        // Reset all limb custom properties
        function resetPose() {
            button.style.setProperty("--arm1", "rotate(0deg)");
            button.style.setProperty("--wrist1", "rotate(0deg)");
            button.style.setProperty("--arm2", "rotate(0deg)");
            button.style.setProperty("--wrist2", "rotate(0deg)");
            button.style.setProperty("--leg1", "rotate(0deg)");
            button.style.setProperty("--calf1", "rotate(0deg)");
            button.style.setProperty("--leg2", "rotate(0deg)");
            button.style.setProperty("--calf2", "rotate(0deg)");
        }

        // Alternate walking pose
        function walkStep() {
            pose = !pose;

            if (pose) {
                button.style.setProperty("--arm1", "rotate(18deg)");
                button.style.setProperty("--wrist1", "rotate(-12deg)");
                button.style.setProperty("--arm2", "rotate(-18deg)");
                button.style.setProperty("--wrist2", "rotate(12deg)");
                button.style.setProperty("--leg1", "rotate(16deg)");
                button.style.setProperty("--calf1", "rotate(-10deg)");
                button.style.setProperty("--leg2", "rotate(-16deg)");
                button.style.setProperty("--calf2", "rotate(10deg)");
            } else {
                button.style.setProperty("--arm1", "rotate(-18deg)");
                button.style.setProperty("--wrist1", "rotate(12deg)");
                button.style.setProperty("--arm2", "rotate(18deg)");
                button.style.setProperty("--wrist2", "rotate(-12deg)");
                button.style.setProperty("--leg1", "rotate(-16deg)");
                button.style.setProperty("--calf1", "rotate(10deg)");
                button.style.setProperty("--leg2", "rotate(16deg)");
                button.style.setProperty("--calf2", "rotate(-10deg)");
            }
        }

        // Click handler – start the logout animation sequence
        button.addEventListener("click", () => {
            // prevent re-trigger while playing
            if (button.classList.contains("playing")) return;

            button.classList.add("playing");
            button.classList.add("walk");

            // start walking cycle
            walkInterval = setInterval(walkStep, 170);

            // stop walking after ~0.9s
            setTimeout(() => {
                clearInterval(walkInterval);
                walkInterval = null;
                button.classList.remove("walk");
                resetPose();
            }, 900);

            // start fall after ~1.05s
            setTimeout(() => {
                button.classList.add("fall");
            }, 1050);

            // full reset after ~2.3s
            setTimeout(() => {
                if (walkInterval) {
                    clearInterval(walkInterval);
                    walkInterval = null;
                }
                button.classList.remove("walk", "fall", "playing");
                resetPose();
                pose = false;
            }, 2300);
        });
    </script>

</body>
</html>
